<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Admin — ChromeAgenda</title>

  <script>
    (function () {
      try {
        var saved = localStorage.getItem("chromeagenda-theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html">
        <span class="brand-mark">🛠️</span>
        <span>ChromeAgenda · Admin</span>
      </a>
      <nav class="nav">
        <a href="../index.html">Ver site</a>
      </nav>
      <div class="header-actions">
        <span style="font-size:.85rem;color:var(--muted)" id="admin-nome"></span>
        <button class="btn btn-ghost btn-sm" id="btn-sair" type="button">Sair</button>
        <button id="theme-toggle" class="btn-icon" aria-label="Alternar tema">
          <span class="ico-light">🌙</span>
          <span class="ico-dark">☀️</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 style="margin:1.5rem 0 1rem;font-size:1.5rem;letter-spacing:-.02em">Visão geral</h1>

    <div class="stats">
      <div class="card stat">
        <div class="stat-label">Agendamentos</div>
        <div class="stat-value accent" id="stat-total">—</div>
      </div>
      <div class="card stat">
        <div class="stat-label">Pendentes</div>
        <div class="stat-value" id="stat-pendentes">—</div>
      </div>
      <div class="card stat">
        <div class="stat-label">Aprovados</div>
        <div class="stat-value" id="stat-aprovados">—</div>
      </div>
      <div class="card stat">
        <div class="stat-label">Usuários</div>
        <div class="stat-value" id="stat-usuarios">—</div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem">
        <div>
          <h2 class="card-title">Agendamentos</h2>
          <p class="card-sub" style="margin:0">Aprove ou cancele as solicitações.</p>
        </div>
        <select class="select" id="filtro-status" style="width:auto">
          <option value="">Todos</option>
          <option value="pendente">Pendentes</option>
          <option value="aprovado">Aprovados</option>
          <option value="cancelado">Cancelados</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Período</th>
              <th>Professor</th>
              <th>Qtd / Sala</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-agendamentos">
            <tr><td colspan="6" style="text-align:center;color:var(--muted)">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Laboratório Móvel de Chromebooks · Painel Administrativo</span>
      <a class="admin-link" href="../index.html">← Voltar ao site</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/guard.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
