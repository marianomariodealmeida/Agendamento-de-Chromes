<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Painel — ChromeAgenda</title>

  <script>
    (function () {
      try {
        var saved = localStorage.getItem("chromeagenda-theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">💻</span>
        <span>ChromeAgenda</span>
      </a>
      <nav class="nav">
        <a href="index.html">Início</a>
        <a href="index.html#calendario">Calendário</a>
      </nav>
      <div class="header-actions">
        <div id="user-area" style="display:flex;gap:.5rem;align-items:center"></div>
        <button id="theme-toggle" class="btn-icon" aria-label="Alternar tema">
          <span class="ico-light">🌙</span>
          <span class="ico-dark">☀️</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="container" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:1.5rem;align-items:start">
      <div class="card">
        <h2 class="card-title">Novo agendamento</h2>
        <p class="card-sub">Solicite o uso do carrinho de Chromebooks.</p>

        <form id="form-agendamento" name="agendamento">
          <div class="field">
            <label for="data">Data</label>
            <input class="input" type="date" id="data" name="data" required />
          </div>
          <div class="form-row">
            <div class="field">
              <label for="periodo">Período</label>
              <select class="select" id="periodo" name="periodo" required>
                <option value="manha">Manhã</option>
                <option value="tarde">Tarde</option>
                <option value="noite">Noite</option>
              </select>
            </div>
            <div class="field">
              <label for="quantidade">Quantidade</label>
              <input class="input" type="number" id="quantidade" name="quantidade" value="1" min="1" max="40" required />
            </div>
          </div>
          <div class="field">
            <label for="sala">Sala / Turma</label>
            <input class="input" type="text" id="sala" name="sala" placeholder="Ex.: Sala 12 — 9ºB" />
          </div>
          <div class="field">
            <label for="observacoes">Observações (opcional)</label>
            <textarea class="textarea" id="observacoes" name="observacoes" placeholder="Alguma necessidade específica?"></textarea>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Solicitar agendamento</button>
        </form>
      </div>

      <div class="card">
        <h2 class="card-title">Meus agendamentos</h2>
        <p class="card-sub">Acompanhe o status das suas solicitações.</p>
        <div class="list" id="meus-agendamentos">
          <p class="empty">Carregando…</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Laboratório Móvel de Chromebooks · Agendamento Escolar</span>
      <a class="admin-link" href="admin-login.html">Acesso administrativo</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/guard.js"></script>
  <script src="assets/js/agendamento.js"></script>
  <script>
    Auth.renderHeaderUser("#user-area", {
      loginHref: "login.html",
      painelHref: "agendamento-usuario.html",
      adminHref: "admin/",
      afterLogout: "index.html",
    });
  </script>
</body>
</html>
