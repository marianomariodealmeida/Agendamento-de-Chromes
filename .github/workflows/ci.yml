name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sintaxe dos JavaScript
        run: |
          set -e
          for f in $(find assets/js -name '*.js' -not -path '*/node_modules/*'); do
            echo "check $f"
            node --check "$f"
          done

      - name: Assets locais referenciados no HTML
        run: node scripts/check-assets.mjs

      - name: Nenhuma chave sensível commitada
        run: node scripts/check-secrets.mjs
