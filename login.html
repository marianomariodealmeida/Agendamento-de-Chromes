<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Agendamento de Chromebooks</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <!-- Importando a biblioteca oficial do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --ink: #17352e;
      --paper: #f4f1e8;
      --a: #dd6a3c;
      --b: #277a74;
    }
    * { box-sizing: border-box; }
    body { 
      font-family: "DM Sans", sans-serif; 
      color: var(--ink); 
      background-color: var(--paper);
    }
    .display-font { font-family: "Fraunces", serif; }
    .paper-grid {
      background-image: linear-gradient(rgba(23,53,46,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(23,53,46,.035) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    input:focus-visible {
      outline: 3px solid #dd6a3c;
      outline-offset: 2px;
    }
  </style>
</head>
<body class="paper-grid min-h-screen flex items-center justify-center p-5">

  <main class="w-full max-w-md bg-white rounded-2xl p-8 shadow-sm border" style="border-color:#d8d5c8;">
    <div class="text-center mb-8">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl text-white mb-4" style="background:#17352e;">
        <i data-lucide="lock" width="25" height="25"></i>
      </div>
      <h1 class="display-font text-2xl mb-1">Acesso Restrito</h1>
      <p class="text-sm opacity-80">Faça login para gerenciar os agendamentos</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1.5" for="email">E-mail</label>
        <input id="email" type="email" required class="w-full rounded-xl border bg-white px-3.5 py-3 text-sm shadow-sm" style="border-color:#d8d5c8;" placeholder="admin@escola.com.br">
      </div>
      
      <div>
        <label class="block text-sm font-semibold mb-1.5" for="password">Senha</label>
        <input id="password" type="password" required class="w-full rounded-xl border bg-white px-3.5 py-3 text-sm shadow-sm" style="border-color:#d8d5c8;" placeholder="••••••••">
      </div>

      <button id="submit-button" type="submit" class="w-full flex items-center justify-center gap-2 rounded-xl px-4 py-3.5 text-sm font-bold shadow-sm transition hover:opacity-90 text-white mt-6" style="background: var(--ink);">
        <i data-lucide="log-in" width="18" height="18"></i>
        <span>Entrar no Sistema</span>
      </button>
    </form>

    <p id="form-message" class="mt-4 text-center min-h-[1.25rem] text-sm font-medium" role="status" aria-live="polite"></p>
  </main>

  <script>
    lucide.createIcons();

    // 1. Configuração do Supabase (COLE SUAS CHAVES AQUI)
    const supabaseUrl = 'SUA_SUPABASE_URL_AQUI';
    const supabaseAnonKey = 'SUA_SUPABASE_ANON_KEY_AQUI';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

    // 2. Elementos da interface
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const messageEl = document.getElementById('form-message');
    const submitBtn = document.getElementById('submit-button');

    function showMessage(text, isError = false) {
      messageEl.textContent = text;
      messageEl.style.color = isError ? "#b3442c" : "#277a74";
    }

    // 3. Lógica de Login
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.6';
      showMessage("Autenticando...");

      const email = emailInput.value;
      const password = passwordInput.value;

      // Chama a função de autenticação do Supabase
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        showMessage("E-mail ou senha incorretos.", true);
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
      } else {
        showMessage("Login realizado com sucesso! Redirecionando...");
        // Redireciona para a página administrativa
        window.location.href = '/admin/'; 
      }
    });

    // 4. Verifica se já está logado (para pular essa tela se necessário)
    async function checkLogin() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = '/admin/';
      }
    }
    
    // Executa a verificação ao carregar a página
    checkLogin();
  </script>
</body>
</html>
