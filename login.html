<body class="paper-grid min-h-screen flex flex-col justify-between">

      <a href="https://chat.whatsapp.com/E811s3sroHGFl1u8FvMY44" target="_blank" rel="noopener" class="btn btn-what btn-sm">

  <main class="flex flex-1 items-center justify-center p-5">

      <div class="mb-6 flex rounded-xl border p-1" style="border-color:var(--line); background:var(--paper);">
        <button id="tab-login" class="tab-btn w-1/2 justify-center bg-white text-[#17352e] shadow-sm">Já tenho conta</button>

      <form id="login-form" class="space-y-4">

        </div>
        <div>
          <label class="label" for="login-password">Senha</label>
          <div class="relative">
            <input id="login-password" type="password" required class="input pr-11" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="pw-toggle absolute right-1.5 top-1/2 -translate-y-1/2 rounded-lg p-2 text-[#537069] hover:bg-[#f0ede1]" aria-label="Mostrar senha">

        </div>
        <div class="flex justify-end">
          <button type="button" id="forgot-btn" class="text-xs font-bold text-[#c0562b] underline-offset-2 hover:underline">Esqueci minha senha</button>
        </div>
        <button id="login-btn" type="submit" class="btn btn-dark btn-lg w-full">
          <i data-icon="log-in" class="h-4 w-4"></i> Entrar no Sistema
        </button>
      </form>

      <form id="register-form" class="hidden space-y-4">
        <div>
          <label class="label" for="reg-name">Nome Completo</label>
          <input id="reg-name" type="text" required class="input" placeholder="Prof. Carlos Andrade" autocomplete="name">
        </div>
        <div>
          <label class="label" for="reg-email">E-mail Institucional</label>
          <input id="reg-email" type="email" required class="input" placeholder="professor@escola.com" autocomplete="email">
        </div>
        <div>
          <label class="label" for="reg-password">Criar Senha</label>
          <div class="relative">
            <input id="reg-password" type="password" required minlength="6" class="input pr-11" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            <button type="button" class="pw-toggle absolute right-1.5 top-1/2 -translate-y-1/2 rounded-lg p-2 text-[#537069] hover:bg-[#f0ede1]" aria-label="Mostrar senha">
              <i data-icon="eye" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
        <button id="reg-btn" type="submit" class="btn btn-primary btn-lg w-full">
          <i data-icon="user-plus" class="h-4 w-4"></i> Cadastrar e Entrar
        </button>
      </form>

      <p id="auth-message" class="mt-4 min-h-[1.25rem] text-center text-xs font-semibold"></p>
    </div>

  <footer class="py-4 text-center text-xs opacity-60">

<script>

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.querySelector('#email').value;
    const senha = document.querySelector('#senha').value;

    const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });
    if (error) return alert('Erro: ' + error.message);

    // Redireciona conforme o cargo (professor ou admin)
    const { data: perfil } = await supabase
      .from('perfis').select('cargo').eq('id', data.user.id).single();

    window.location.href = perfil?.cargo === 'admin' ? 'admin/' : 'agendamento-usuario.html';
  });
async function carregarCalendario() {
    const inicioSemana = new Date(); // ajustar para segunda-feira
    const fimSemana = new Date(inicioSemana); fimSemana.setDate(fimSemana.getDate() + 6);

    const { data: agendamentos, error } = await supabase
      .from('agendamentos')
      .select('*')
      .gte('data', inicioSemana.toISOString().split('T')[0])
      .lte('data', fimSemana.toISOString().split('T')[0]);

    if (error) return console.error(error);

    const container = document.querySelector('.calendario-grid'); // ajuste o seletor
    container.innerHTML = ''; // limpa antes de renderizar

    for (let i = 0; i < 7; i++) {
      const dia = new Date(inicioSemana);
      dia.setDate(dia.getDate() + i);
      const celula = document.createElement('div');
      celula.className = 'dia-calendario';
      celula.textContent = dia.getDate();

      // Marca dias com agendamentos
      if (agendamentos.some(a => a.data === dia.toISOString().split('T')[0])) {
        celula.classList.add('ocupado');
      }
      container.appendChild(celula);
    }
  }
  carregarCalendario();
</script>
</html>
