<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — ChromeAgenda</title>

  <script>
    (function () {
      try {
        var saved = localStorage.getItem("chromeagenda-theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">💻</span>
        <span>ChromeAgenda</span>
      </a>
      <nav class="nav">
        <a href="index.html">Início</a>
      </nav>
      <div class="header-actions">
        <button id="theme-toggle" class="btn-icon" aria-label="Alternar tema">
          <span class="ico-light">🌙</span>
          <span class="ico-dark">☀️</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="container auth-wrap">
      <div class="card auth-card">
        <h1>Bem-vindo de volta</h1>
        <p class="sub">Entre para agendar os Chromebooks da escola.</p>

        <div class="tabs">
          <button class="tab active" data-tab="login" type="button">Entrar</button>
          <button class="tab" data-tab="cadastro" type="button">Criar conta</button>
        </div>

        <!-- LOGIN -->
        <form id="form-login">
          <div class="field">
            <label for="email">E-mail institucional</label>
            <input class="input" type="email" id="email" placeholder="seu.nome@escola.edu.br" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input class="input" type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <button class="btn btn-primary btn-block" type="submit">Entrar no Sistema</button>
        </form>

        <!-- CADASTRO -->
        <form id="form-cadastro" hidden>
          <div class="field">
            <label for="cad-nome">Nome completo</label>
            <input class="input" type="text" id="cad-nome" placeholder="Maria Silva" required />
          </div>
          <div class="field">
            <label for="cad-email">E-mail institucional</label>
            <input class="input" type="email" id="cad-email" placeholder="seu.nome@escola.edu.br" required />
          </div>
          <div class="field">
            <label for="cad-senha">Senha (mínimo 6 caracteres)</label>
            <input class="input" type="password" id="cad-senha" placeholder="••••••••" minlength="6" required />
          </div>
          <button class="btn btn-primary btn-block" type="submit">Criar conta</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Laboratório Móvel de Chromebooks · Agendamento Escolar</span>
      <a class="admin-link" href="admin-login.html">Acesso administrativo</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
